name: Test
on:
  push:
    branches:
      - main
  # Every pull request, including those stacked on another branch
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Run Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      # dart analyze rather than flutter analyze, because flutter analyze doesn't report diagnostics
      # from analyzer plugins such as tool/quickshop_lints. --fatal-infos fails on lints too.
      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test lint rules
        working-directory: tool/quickshop_lints
        run: |
          dart pub get
          dart test

      - name: Run Flutter tests
        run: flutter test --coverage
