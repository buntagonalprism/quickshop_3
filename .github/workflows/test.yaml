
name: Test
on:
  push:
    branches:
      - main
  # Every pull request, including those stacked on another branch
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Run Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      # --fatal-infos fails on lints too, not just errors and warnings.
      # To do comments are still allowed - they don't count as an info, warning, or error.
      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run Flutter tests
        run: flutter test --coverage