name: quickshop
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev.
publish_to: 'none'


environment:
  sdk: ^3.13.0

dependencies:
  animations: ^2.0.11
  cloud_firestore: ^6.2.0
  collection: ^1.19.0
  device_info_plus: ^13.2.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  firebase_analytics: ^12.2.0
  firebase_auth: ^6.3.0
  firebase_core: ^4.6.0
  firebase_ui_auth: ^3.0.1
  firebase_ui_oauth_google: ^2.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  flutter_svg: ^2.0.16
  freezed_annotation: ^3.1.0
  go_router: ^16.0.0
  google_sign_in: ^6.2.1
  http: ^1.2.2
  intl: ^0.20.0
  json_annotation: ^4.12.0
  marionette_flutter: ^0.4.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.5
  riverpod: ^3.0.3
  riverpod_annotation: ^4.0.7
  sentry_flutter: ^9.30.0
  share_plus: ^13.3.0
  shared_preferences: ^2.3.2
  skeletonizer: ^2.1.0
  uuid: ^4.5.1
  geolocator: ^13.0.2
  google_maps_flutter: ^2.10.0
  words_to_numbers:
    git: https://github.com/buntagonalprism/words_to_numbers
  clock: ^1.1.3

# Both overrides exist to keep desktop_webview_auth out of the build. It is
# archived upstream and its Android module applies the Kotlin Gradle Plugin
# unconditionally, which AGP 9 rejects under built-in Kotlin.
#
# firebase_ui_oauth: released 2.1.1 still depends on desktop_webview_auth.
#   FirebaseUI-Flutter#693 (merged 2026-09-17) replaces it with
#   flutter_web_auth_2, so this tracks that commit until it is published.
#   Drop this override once firebase_ui_oauth > 2.1.1 is on pub.
#
# flutter_web_auth_2: #693 asks for ^5.1.0, but 5.1.0 also applies KGP
#   unconditionally. The built-in Kotlin migration only exists on the 6.0.0
#   line, so this pins the prerelease. Dropping this override requires either a
#   5.x backport or firebase_ui_oauth widening to ^6.0.0 after 6.0.0 is stable,
#   so it will likely outlive the override above.
dependency_overrides:
  firebase_ui_oauth:
    git:
      url: https://github.com/firebase/FirebaseUI-Flutter.git
      path: packages/firebase_ui_oauth
      ref: 235b4071cd62edcf35ac0503900060edab1c0474
  flutter_web_auth_2: 6.0.0-alpha.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  riverpod_generator: ^4.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  fake_async: ^1.3.1
  mocktail: ^1.0.4
  drift_dev: ^2.35.0
  marionette_mcp: ^0.4.0

flutter:
  uses-material-design: true
  fonts:
    - family: RacingSansOne
      fonts:
        - asset: assets/fonts/RacingSansOne-Regular.ttf

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - assets/logo/
    - assets/fonts/
